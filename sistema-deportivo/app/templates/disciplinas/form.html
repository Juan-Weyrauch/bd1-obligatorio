{% extends "base.html" %}
{% block title %}{{ "Editar" if modo == "editar" else "Nueva" }} disciplina{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3">{{ "Editar" if modo == "editar" else "Nueva" }} disciplina</h1>

<form method="post" class="col-md-6">
  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombre" name="nombre"
           maxlength="100" required
           value="{{ disciplina.nombre if disciplina else '' }}">
    <div class="form-text">Obligatorio. Máximo 100 caracteres. No se puede repetir.</div>
  </div>
  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('disciplinas.listar') }}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
