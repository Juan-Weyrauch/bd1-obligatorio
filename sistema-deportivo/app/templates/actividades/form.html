{% extends "base.html" %}
{% block title %}{{ "Editar" if modo == "editar" else "Nueva" }} actividad{% endblock %}
{% block contenido %}
<h1 class="h3 mb-3">{{ "Editar" if modo == "editar" else "Nueva" }} actividad</h1>

<form method="post" class="col-md-8">
  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombre" name="nombre"
           maxlength="150" required
           value="{{ actividad.nombre if actividad else '' }}">
    <div class="form-text">Obligatorio. Maximo 150 caracteres.</div>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label for="id_disciplina" class="form-label">Disciplina</label>
      <select class="form-select" id="id_disciplina" name="id_disciplina" required>
        <option value="">Selecciona una disciplina</option>
        {% for disciplina in disciplinas %}
        <option value="{{ disciplina.id_disciplina }}"
                {% if actividad and actividad.id_disciplina|string == disciplina.id_disciplina|string %}selected{% endif %}>
          {{ disciplina.nombre }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-6 mb-3">
      <label for="id_espacio" class="form-label">Espacio</label>
      <select class="form-select" id="id_espacio" name="id_espacio" required>
        <option value="">Selecciona un espacio</option>
        {% for espacio in espacios %}
        <option value="{{ espacio.id_espacio }}"
                {% if actividad and actividad.id_espacio|string == espacio.id_espacio|string %}selected{% endif %}>
          {{ espacio.nombre }} ({{ espacio.ubicacion }})
        </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="cupo_maximo" class="form-label">Cupo maximo</label>
      <input type="number" class="form-control" id="cupo_maximo" name="cupo_maximo"
             min="1" required
             value="{{ actividad.cupo_maximo if actividad else '' }}">
    </div>

    <div class="col-md-4 mb-3">
      <label for="dia_semana" class="form-label">Dia de la semana</label>
      <select class="form-select" id="dia_semana" name="dia_semana" required>
        <option value="">Selecciona un dia</option>
        {% for dia in dias_semana %}
        <option value="{{ dia }}"
                {% if actividad and actividad.dia_semana == dia %}selected{% endif %}>
          {{ dia|capitalize }}
        </option>
        {% endfor %}
      </select>
    </div>

    <div class="col-md-4 mb-3">
      <label for="horario" class="form-label">Horario</label>
      <input type="time" class="form-control" id="horario" name="horario" required
             value="{{ actividad.horario if actividad else '' }}">
    </div>
  </div>

  <div class="mb-3">
    <label for="estado" class="form-label">Estado</label>
    <select class="form-select" id="estado" name="estado" required>
      {% for estado in estados %}
      <option value="{{ estado }}"
              {% if actividad and actividad.estado == estado %}selected{% elif not actividad and estado == 'abierta' %}selected{% endif %}>
        {{ estado|capitalize }}
      </option>
      {% endfor %}
    </select>
  </div>

  <button type="submit" class="btn btn-primary">Guardar</button>
  <a href="{{ url_for('actividades.listar') }}" class="btn btn-link">Cancelar</a>
</form>
{% endblock %}
