{% extends "base.html" %}
{% block title %}Facultades{% endblock %}
{% block contenido %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Facultades</h1>
  <a href="{{ url_for('facultades.nueva') }}" class="btn btn-primary">Nueva facultad</a>
</div>

{% if facultades %}
<table class="table table-striped align-middle">
  <thead>
    <tr><th>Nombre</th><th class="text-end">Acciones</th></tr>
  </thead>
  <tbody>
    {% for f in facultades %}
    <tr>
      <td>{{ f.nombre }}</td>
      <td class="text-end">
        <a href="{{ url_for('facultades.editar', id_facultad=f.id_facultad) }}"
           class="btn btn-sm btn-outline-secondary">Editar</a>
        <form method="post"
              action="{{ url_for('facultades.eliminar', id_facultad=f.id_facultad) }}"
              class="d-inline"
              onsubmit="return confirm('¿Eliminar la facultad {{ f.nombre }}?');">
          <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-muted">No hay facultades cargadas todavia.</p>
{% endif %}
{% endblock %}
